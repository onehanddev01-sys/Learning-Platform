<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python เริ่มจากศูนย์ — เรียนเขียนโปรแกรมด่านแรกถึงโปรเจกต์จริง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="welcome-page">

  <main class="welcome-hero">
    <div class="hero-stars" aria-hidden="true"></div>
    <div class="hero-content">
      <svg class="hero-rocket" viewBox="0 0 24 24" width="72" height="72" fill="currentColor" aria-hidden="true">
        <path d="M12 2c3.5 2 5.5 5.5 5.5 9.5 0 1.5-.3 2.9-.8 4.2l2.3 2.8-1.4 1.4-2.6-2.1c-.9.9-1.9 1.6-3 2.2-1.1-.6-2.1-1.3-3-2.2l-2.6 2.1-1.4-1.4 2.3-2.8c-.5-1.3-.8-2.7-.8-4.2C6.5 7.5 8.5 4 12 2zm0 6.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM8.5 20.5c.4 1 1 1.9 1.8 2.7.6-.3 1.2-.7 1.7-1.1.5.4 1.1.8 1.7 1.1.8-.8 1.4-1.7 1.8-2.7-.9.5-1.8.9-2.8 1.2l-.7.2-.7-.2c-1-.3-1.9-.7-2.8-1.2z"/>
      </svg>
      <h1>Python เริ่มจากศูนย์</h1>
      <p class="hero-sub">ภารกิจฝึกเขียนโปรแกรมสำหรับคนที่ไม่เคยเขียนโค้ดมาก่อน<br>
      รันได้ทันทีในเบราว์เซอร์ ผิดได้ไม่มีหักคะแนน แล้วจบด้วยโปรเจกต์ของคุณเอง</p>
      <div class="hero-actions">
        <a id="start-btn" class="btn btn-primary btn-big" href="mission.html?id=m1">เริ่มต้นเรียนรู้</a>
        <a class="btn btn-ghost" href="map.html">ดูแผนที่บทเรียน</a>
      </div>
      <p class="hero-note">ไม่ต้องสมัครสมาชิก ไม่ต้องติดตั้งโปรแกรมใด ๆ</p>
    </div>
  </main>

  <script src="data/missions.js"></script>
  <script src="js/progress.js"></script>
  <script>
    // ปรับปุ่มหลักตามความก้าวหน้า: เคยเรียนแล้ว → พาไปด่านล่าสุดที่ค้าง
    (function () {
      Progress.initBanner();
      var state = Progress.load();
      var startBtn = document.getElementById('start-btn');
      var started = state.completed.length > 0 || Object.keys(state.savedCode).length > 0;
      if (started) {
        var next = Progress.nextMissionId();
        if (next) {
          startBtn.textContent = 'เรียนต่อจากที่ค้างไว้';
          startBtn.href = 'mission.html?id=' + next;
        } else {
          startBtn.textContent = 'ทบทวนบทเรียน';
          startBtn.href = 'map.html';
        }
      }
    })();
  </script>
</body>
</html>
