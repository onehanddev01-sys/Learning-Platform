<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Test Harness (สำหรับผู้พัฒนา)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* สไตล์เฉพาะหน้า dev — ไม่มีลิงก์จากหน้าเว็บจริงมาที่นี่ */
    body { background: #10152e; color: #e8ecf8; font-family: Sarabun, 'Leelawadee UI', Tahoma, sans-serif; padding: 24px; }
    h1 { font-size: 22px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; background: #1a2142; }
    th, td { border: 1px solid #2c3560; padding: 8px 12px; text-align: left; font-size: 14px; }
    th { background: #232b52; }
    .pass { background: #14532d; color: #bbf7d0; font-weight: 600; }
    .fail { background: #7c2d12; color: #fed7aa; font-weight: 600; }
    .summary { margin-top: 16px; font-size: 18px; font-weight: 700; }
    .summary.ok { color: #4ade80; }
    .summary.bad { color: #fb923c; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Self-Test Harness — ตรวจทุกด่านอัตโนมัติ</h1>
  <p>เกณฑ์: (a) โค้ดเฉลย (referenceSolution) ต้อง <strong>ผ่าน</strong> ทุกด่าน
     (b) โค้ดตั้งต้น (starterCode) ต้อง <strong>ไม่ผ่าน</strong> ทุกด่าน — พิสูจน์ว่ากด Run เฉย ๆ ไม่มีทางผ่าน</p>
  <p id="status">กำลังทดสอบ…</p>
  <table id="result-table">
    <thead>
      <tr><th>ด่าน</th><th>ชื่อ</th><th>เฉลยต้องผ่าน</th><th>ตั้งต้นต้องไม่ผ่าน</th><th>หมายเหตุ</th></tr>
    </thead>
    <tbody id="result-body"></tbody>
  </table>
  <div id="summary" class="summary"></div>

  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script>window.Sk || document.write('<script src="vendor/skulpt.min.js"><\/script>');</script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <script>(window.Sk && Sk.builtinFiles) || document.write('<script src="vendor/skulpt-stdlib.js"><\/script>');</script>

  <script src="data/missions.js"></script>
  <script src="js/checker.js"></script>
  <script src="js/runner.js"></script>
  <script>
    (function () {
      'use strict';

      var tbody = document.getElementById('result-body');
      var passCount = 0;
      var failCount = 0;

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      /*
       * ทดสอบ 1 ด่าน: รันเฉลย (ต้อง PASS) แล้วค่อยรันโค้ดตั้งต้น (ต้อง FAIL)
       * สำคัญ: ต้องรัน "ทีละตัวตามลำดับ" เพราะ Skulpt ใช้ config กลางร่วมกัน
       * ถ้ารันซ้อนกัน โค้ดที่มี suspension (input/ลูป) จะโดนตั้งค่าทับและผลเพี้ยน
       */
      function testMission(m) {
        var notes = [];
        var starter = (m.task && m.task.starterCode) || '';

        // (a) โค้ดเฉลยต้องผ่าน checker
        return Runner.runForTest(m.referenceSolution, m.testInputs || [])
          .then(function (result) {
            var verdict = Checker.check(m, m.referenceSolution, result);
            if (!verdict.passed) {
              notes.push('เฉลยไม่ผ่าน: ติดที่กติกา ' + (verdict.failedRule || '?') +
                (result.error ? ' (มี Error: ' + String(result.error) + ')' : ''));
            }
            return verdict.passed;
          })
          .then(function (refOk) {
            // (b) โค้ดตั้งต้นต้องไม่ผ่าน (Error ก็นับว่าไม่ผ่าน)
            return Runner.runForTest(starter, m.testInputs || []).then(function (result) {
              var verdict = Checker.check(m, starter, result);
              if (verdict.passed) {
                notes.push('อันตราย! กด Run เฉย ๆ แล้วผ่านได้');
              }
              return { mission: m, refOk: refOk, starterOk: !verdict.passed, notes: notes };
            });
          });
      }

      function renderRow(r) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><code>' + esc(r.mission.id) + '</code></td>' +
          '<td>' + esc(r.mission.title) + '</td>' +
          '<td class="' + (r.refOk ? 'pass' : 'fail') + '">' + (r.refOk ? 'PASS' : 'FAIL') + '</td>' +
          '<td class="' + (r.starterOk ? 'pass' : 'fail') + '">' + (r.starterOk ? 'PASS' : 'FAIL') + '</td>' +
          '<td>' + esc(r.notes.join(' | ')) + '</td>';
        tbody.appendChild(tr);
        if (r.refOk && r.starterOk) passCount++; else failCount++;
      }

      // รันทีละด่านตามลำดับ (Skulpt ใช้ config ร่วมกัน จึงห้ามรันขนาน)
      var chain = Promise.resolve();
      MISSIONS.forEach(function (m) {
        chain = chain.then(function () {
          document.getElementById('status').textContent = 'กำลังทดสอบด่าน ' + m.id + ' …';
          return testMission(m).then(renderRow);
        });
      });

      chain.then(function () {
        document.getElementById('status').textContent = 'ทดสอบเสร็จแล้ว';
        var el = document.getElementById('summary');
        var total = MISSIONS.length;
        if (failCount === 0) {
          el.className = 'summary ok';
          el.textContent = 'ผ่านครบ ' + passCount + '/' + total + ' ด่าน — ระบบพร้อมใช้งาน';
        } else {
          el.className = 'summary bad';
          el.textContent = 'มีปัญหา ' + failCount + ' ด่าน จากทั้งหมด ' + total + ' — ดูแถวสีส้มด้านบน';
        }
        // ให้สคริปต์ภายนอก (เช่น ตัวทดสอบอัตโนมัติ) อ่านผลได้
        window.__TEST_DONE__ = { pass: passCount, fail: failCount, total: total };
      });
    })();
  </script>
</body>
</html>
