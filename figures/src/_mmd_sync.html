<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #wrap { display: inline-block; padding: 22px; }
  .mermaid { font-family: 'Leelawadee UI', 'Tahoma', sans-serif; }
</style>
</head>
<body>
<div id="wrap"><div class="mermaid"></div></div>
<script type="text/plain" id="src">
flowchart TD
    A([ผู้เรียนเปิดเว็บ]) --> B{เข้าสู่ระบบหรือไม่}
    B -- ไม่ --> C[ใช้ localStorage อย่างเดียว]
    C --> G[เรียนตามปกติ]
    B -- ใช่ --> D[อ่านเอกสารของผู้ใช้จาก Firestore]
    D --> E[ผสานข้อมูล local และ cloud<br/>ตามกติกาในตารางที่ 3.8]
    E --> F[เขียนผลการผสานกลับทั้ง<br/>localStorage และ Firestore]
    F --> G
    G --> H{ความก้าวหน้าเปลี่ยนแปลง<br/>ผ่านด่าน หรือ บันทึกโค้ด}
    H -- ใช่ และเป็นสมาชิก --> I[บันทึกลง localStorage ทันที<br/>แล้วส่งขึ้น Firestore แบบหน่วงเวลา]
    H -- ใช่ แต่เป็นผู้เยี่ยมชม --> J[บันทึกลง localStorage อย่างเดียว]
    I --> G
    J --> G
</script>
<script>
  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose',
    themeVariables: { fontFamily: "'Leelawadee UI','Tahoma',sans-serif" } });
  document.querySelector('.mermaid').textContent = document.getElementById('src').textContent.trim();
  mermaid.run();
</script>
</body>
</html>
